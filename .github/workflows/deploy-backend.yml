name: Deploy Backend

on:
  push:
    branches: [dev, main]
    paths:
      - "PlayCode/**"
      - "!PlayCode/PlayCircleApp/**"
      - ".github/workflows/deploy-backend.yml"
  pull_request:
    branches: [dev, main]
    paths:
      - "PlayCode/**"
      - "!PlayCode/PlayCircleApp/**"
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: PlayCode
        run: pip install -r requirements.txt

      - name: Smoke test — app imports cleanly
        working-directory: PlayCode
        run: python -c "import app.main"

      - name: Check for Python syntax errors across the project
        working-directory: PlayCode
        run: python -m py_compile $(find app -name "*.py")

  # Push to `dev` -> Azure Dev, automatically, no approval needed.
  # This is intentionally the only deploy job for now. When you're ready to
  # promote to UAT/Prod, add "deploy-uat" (environment: uat, if: branch==main)
  # and "deploy-prod" (environment: production, needs: deploy-uat) here —
  # same file, same pattern, each pulling its own environment's secrets.
  deploy-dev:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Azure App Service (Dev)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: PlayCode
