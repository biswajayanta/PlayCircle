name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - "PlayCode/**"
      - "!PlayCode/PlayCircleApp/**"
      - ".github/workflows/deploy-backend.yml"
  pull_request:
    branches: [main]
    paths:
      - "PlayCode/**"
      - "!PlayCode/PlayCircleApp/**"
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: PlayCode
        run: pip install -r requirements.txt

      - name: Smoke test — app imports cleanly
        working-directory: PlayCode
        run: python -c "import app.main"

      - name: Check for Python syntax errors across the project
        working-directory: PlayCode
        run: python -m py_compile $(find app -name "*.py")

      # There's no automated test suite yet — add pytest here once one exists.
      # This job intentionally fails the build on any import/syntax error so
      # a broken PR can't be merged and a broken deploy never reaches Azure.

  deploy:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: PlayCode
