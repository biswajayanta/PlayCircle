name: Deploy Backend

on:
  push:
    branches: [dev, main]
    paths:
      - "PlayCode/**"
      - "!PlayCode/PlayCircleApp/**"
      - ".github/workflows/deploy-backend.yml"
  pull_request:
    branches: [dev, main]
    paths:
      - "PlayCode/**"
      - "!PlayCode/PlayCircleApp/**"
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PLAYCIRCLE_DB_HOST: 127.0.0.1
      PLAYCIRCLE_PORT: 5432
      PLAYCIRCLE_USER: postgres
      PLAYCIRCLE_PASSWORD: ci-only-password
      # PLAYCIRCLE_NAME is deliberately not set here — conftest.py always
      # targets a fixed, obviously-a-test database name, as a safety net
      # against ever pointing the suite at something real.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: PlayCode
        run: pip install -r requirements-test.txt

      - name: Smoke test — app imports cleanly
        working-directory: PlayCode
        run: python -c "import app.main"

      - name: Check for Python syntax errors across the project
        working-directory: PlayCode
        run: python -m py_compile $(find app -name "*.py")

      - name: Run regression suite
        working-directory: PlayCode
        run: python -m pytest tests/ -v

  deploy-dev:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Azure App Service (Dev)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: PlayCode
