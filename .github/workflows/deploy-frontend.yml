name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - "PlayCode/PlayCircleApp/**"
      - ".github/workflows/deploy-frontend.yml"
  pull_request:
    branches: [main]
    paths:
      - "PlayCode/PlayCircleApp/**"
  workflow_dispatch: {}

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: PlayCode/PlayCircleApp
        run: npm ci

      - name: Type-check
        working-directory: PlayCode/PlayCircleApp
        run: npx tsc --noEmit

      - name: Build web export
        working-directory: PlayCode/PlayCircleApp
        env:
          # Points the deployed frontend at the deployed backend — set this
          # repo variable once the backend's Azure URL is known.
          EXPO_PUBLIC_API_URL: ${{ vars.PLAYCIRCLE_API_URL }}
        run: npx expo export -p web

      - name: Deploy to Azure Static Web Apps
        if: github.event_name != 'pull_request'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: PlayCode/PlayCircleApp/dist
          skip_app_build: true
