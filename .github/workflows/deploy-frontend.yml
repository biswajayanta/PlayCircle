name: Deploy Frontend

on:
  push:
    branches: [dev, main]
    paths:
      - "PlayCode/PlayCircleApp/**"
      - ".github/workflows/deploy-frontend.yml"
  pull_request:
    branches: [dev, main]
    paths:
      - "PlayCode/PlayCircleApp/**"
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: PlayCode/PlayCircleApp
        run: npm ci

      - name: Type-check
        working-directory: PlayCode/PlayCircleApp
        run: npx tsc --noEmit

  # Same pattern as the backend workflow — push to `dev` -> Azure Dev
  # automatically. deploy-uat / deploy-prod get added here later.
  deploy-dev:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: PlayCode/PlayCircleApp
        run: npm ci

      - name: Build web export
        working-directory: PlayCode/PlayCircleApp
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.PLAYCIRCLE_API_URL }}
        run: npx expo export -p web

      - name: Deploy to Azure Static Web Apps (Dev)
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: PlayCode/PlayCircleApp/dist
          skip_app_build: true
